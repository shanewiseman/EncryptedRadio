name: Prompt-driven task
description: Define a bounded change for an AI contributor.
title: "task: "
body:
  - type: markdown
    attributes:
      value: "Read AGENTS.md and docs/TASK_TEMPLATE.md for contributor guidance. Do not include private keys, private traffic, credentials, or private prompts."
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: State the problem and who benefits. Include a sanitized prompt summary if useful.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and constraints
      description: Identify affected commands or browser operations, modes/profiles, and input sources. Link relevant files or decisions. Specify scope, exclusions, compatibility, dependencies, and unresolved questions.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes and how they should be verified.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and validation
      description: Include make check and relevant pipeline checks. make demo covers the default rotor/Morse pipeline; verify all affected cipher/transport combinations. Note security constraints, Node.js/browser or audio prerequisites, and whether evidence is synthetic or physical.
