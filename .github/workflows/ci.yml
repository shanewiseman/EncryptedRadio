name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
      - name: Install audio runtime
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libportaudio2
      - name: Install locked Python environment
        run: make sync
      - name: Validate repository and applications
        run: make check
      - name: Exercise terminal demonstration
        run: make demo
      - name: Exercise authenticated packet audio demonstration
        run: uv run --locked --extra audio --extra demo er-demo roundtrip --cipher sealcrypt --transport audiolink --output-dir tmp/demo/seal-audiolink
